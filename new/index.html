/* arena / how / what cards */
.center-head{text-align:center;max-width:680px;margin:0 auto 56px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:40px}
.scen-card{background:#fff;border-radius:22px;padding:28px 26px;border:1px solid var(--line);box-shadow:0 16px 40px rgba(27,42,74,.08);overflow:hidden}
/* Card media bleeds to the card's edges (cancelling its 28/26 padding) and
   keeps only the top corners rounded, so the photograph reads as part of the
   card rather than a picture pasted inside one. */
.scen-media{position:relative;margin:-28px -26px 22px;border-radius:21px 21px 0 0;overflow:hidden;aspect-ratio:16/9;background:var(--navy-deep)}
/* The hidden-until-revealed state is gated on .js-anim (set by an inline script
   in <head>). Without it these rules never apply, so with JS disabled, an error
   before armScenCards(), or no IntersectionObserver, the cards are simply
   VISIBLE rather than three invisible opacity:0 boxes. Same failure class as
   the intro's collapsed stages: never let the resting state depend on JS. */
.js-anim .scen-media{clip-path:inset(0 0 100% 0);transition:clip-path 760ms var(--ease)}
.scen-media img{position:absolute;left:0;top:-6%;width:100%;height:112%;object-fit:cover;will-change:transform}
.scen-card.is-in .scen-media{clip-path:inset(0 0 0 0)}
/* "At your door" ships with no photograph on purpose: the card's own copy says
   the scenario is not built yet and that we would rather ship it late than
   ship it wrong. A polished stock-looking frame would contradict that. The
   hairline hatch marks it as deliberately empty rather than a failed image. */
/* The hatch alone did not carry the intent: the site's own owner read this card
   as a failed image load, and if it reads as broken to the person who built it,
   it reads as broken to a visitor. Keeping it photographless is still right --
   a stock frame would contradict the card's own "not built yet" copy -- so the
   emptiness is now labelled instead of merely textured. It says what it is. */
.scen-media--empty{position:relative;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 9px),
  linear-gradient(160deg,#1b2a4a,#121e38)}
.scen-media--empty::after{
  content:attr(data-label);
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max-content;max-width:80%;text-align:center;
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(232,238,247,.62);
  padding:9px 16px;border:1px dashed rgba(232,238,247,.34);border-radius:99px}
@media (max-width:420px){
  .scen-media--empty::after{font-size:11px;letter-spacing:.06em;padding:7px 12px}
}
.js-anim .scen-card{opacity:0;transform:translateY(16px);transition:opacity 640ms var(--ease),transform 640ms var(--ease),box-shadow 200ms var(--ease)}
.js-anim .scen-card.is-in{opacity:1;transform:none}
.grid-cards > *:nth-child(2) .scen-media{transition-delay:100ms}
.grid-cards > *:nth-child(3) .scen-media{transition-delay:200ms}
.grid-cards > *:nth-child(2).scen-card{transition-delay:100ms}
.grid-cards > *:nth-child(3).scen-card{transition-delay:200ms}
@media (hover:hover) and (pointer:fine){
  .scen-card.is-in:hover{box-shadow:0 22px 54px rgba(27,42,74,.14)}
}
@media (prefers-reduced-motion:reduce){
  .scen-card,.scen-media{transition:opacity 200ms ease;transform:none;clip-path:none}
  .scen-media img{transform:none !important}

.faq-a{font-size:15.5px;color:var(--body);line-height:1.65;margin:16px 0 0;max-width:640px;opacity:0;transform:translateY(-4px);animation:settle 220ms var(--ease) forwards}
@media (prefers-reduced-motion:reduce){.faq-a{animation:none;opacity:1;transform:none}}

.final-cta{background:var(--gold);padding:clamp(70px,9vw,110px) clamp(24px,6vw,64px);text-align:center}

footer{max-width:1180px;margin:0 auto;padding:56px clamp(24px,6vw,64px) 60px}

.foot-links a{font-size:14px;font-weight:600;color:var(--navy);text-decoration:none;white-space:nowrap}

/* ===== mobile nav =====
   Previously this was a bare `.navlinks{display:none}` below 640px with no
   replacement, which did not degrade the nav on phones so much as delete it:
   six destinations became unreachable and the only way to any of them was to
   already know the URL. It also left a dead band between 641px and roughly
   900px where six links wrapped onto two ragged rows under the logo.
   Both are fixed here: the bar collapses to a real trigger at 900px, and the
   sheet is the only thing that owns the links below that. */
.navburger{display:none;align-items:center;justify-content:center;width:44px;height:44px;
  border:1.5px solid var(--navy);border-radius:14px;background:transparent;cursor:pointer;
  padding:0;flex:none;transition:background 180ms var(--ease),transform 180ms var(--ease)}
.navburger:active{transform:scale(.94)}
.navburger span{display:block;width:18px;height:1.5px;background:var(--navy);border-radius:2px;
  transition:transform 320ms var(--ease),opacity 200ms var(--ease)}
.navburger span + span{margin-top:4.5px}
/* The bars become the X. Rotating the existing strokes rather than swapping in
   a different glyph keeps the control continuous across the state change. */
.navburger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.navburger[aria-expanded="true"] span:nth-child(2){opacity:0}
.navburger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
nav.nav-dark .navburger{border-color:rgba(255,255,255,.45)}
nav.nav-dark .navburger span{background:#e8eef7}

/* The panel is never display:none. A transition out of display:none does not
   reliably run -- the browser can collapse the whole change into one frame, and
   forcing a reflow first is a trick that works until it doesn't. visibility
   keeps the element laid out (so the transform has something to animate) while
   still removing it from the tab order and from hit-testing. */
.navscrim{position:fixed;inset:0;z-index:60;background:rgba(15,28,51,.42);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity 320ms var(--ease),visibility 0s linear 320ms}
.navscrim.is-open{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity 320ms var(--ease),visibility 0s}

.navsheet{position:fixed;z-index:61;top:0;right:0;height:100dvh;
  width:min(86vw,380px);max-width:100vw;background:var(--cream);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 28px);
  transform:translateX(100%);visibility:hidden;
  transition:transform 420ms var(--ease),visibility 0s linear 420ms;
  overflow-y:auto;overscroll-behavior:contain}
.navsheet.is-open{transform:translateX(0);visibility:visible;
  transition:transform 420ms var(--ease),visibility 0s}
.navsheet-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:26px;flex:none}
.navsheet-head span{font-size:12px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.navsheet-close{width:44px;height:44px;display:grid;place-items:center;border:0;
  background:transparent;cursor:pointer;color:var(--navy);border-radius:12px;
  font-size:22px;line-height:1;transition:background 160ms var(--ease)}
.navsheet-close:active{background:rgba(27,42,74,.08)}
/* 52px rows, not 14.5px inline text. A phone nav is thumbs, not cursors.
   This container is a <nav> for the landmark, which means the bare `nav{}` rule
   for the top bar lands on it too -- position:fixed, inset, a background, a
   backdrop-filter, a border, padding, and an align-items:center that was
   shrink-wrapping every row and centring it. Same specificity, earlier in the
   file, so it wins on anything this rule leaves unsaid. Everything it sets is
   therefore restated here rather than left to chance. */
.navsheet-links{position:static;inset:auto;z-index:auto;
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  gap:0;padding:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:0}
/* Alignment is stated rather than inherited: several ancestors on this page
   centre their text, and a nav row that silently picks that up reads as a
   centred menu on some breakpoints and a left one on others. */
.navsheet-links a{display:flex;align-items:center;justify-content:flex-start;
  width:100%;text-align:left;min-height:52px;
  font-size:19px;font-weight:700;color:var(--navy);text-decoration:none;
  border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(8px)}
.navsheet.is-open .navsheet-links a{opacity:1;transform:none;
  transition:opacity 380ms var(--ease),transform 380ms var(--ease)}
.navsheet-foot{margin-top:auto;padding-top:26px;display:flex;
  flex-direction:column;gap:14px;flex:none}
.navsheet-foot .langpill{align-self:flex-start}
.navsheet-foot .btn{justify-content:center;width:100%}

@media (max-width:900px){
  .navlinks{display:none}
  .navburger{display:flex}
  /* The language pill lives in the sheet on small screens, so the bar keeps
     only the logo, the CTA and the trigger. */
  nav .navright .langpill{display:none}
}
@media (min-width:901px){
  .navscrim,.navsheet{display:none}
}
@media (prefers-reduced-motion:reduce){
  .navsheet{transition:transform 1ms linear}
  .navscrim{transition:opacity 1ms linear}
  .navsheet-links a{opacity:1;transform:none;transition:none}
  .navburger span{transition:none}
}

/* ===== cinematic scroll intro (scrollcraft) =====
   3 pinned photographic acts above the hero. Engine: ../scroll-intro/
   (same vendored scrollcraft.js/css as index.html's own intro — not
   duplicated). Tokens scoped to #cineIntro so they can't leak into the
   rest of this page the way scrollcraft.css's un-scoped body{} rule
   would if linked globally (see index.html's own integration notes). */
#cineIntro{ --sc-canvas:#0f1c33; --sc-surface:#1B2A4A; --sc-ink:#FAF6EE; --sc-ink-soft:#c9d4e8;
  --sc-accent:#E8B84B; --sc-accent-ink:#1B2A4A;
  --sc-font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
  --sc-font-text:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--sc-ink);
  /* Fixed, NOT var(--sc-canvas): the stages are 100svh while the visual
     viewport can be taller (mobile browser chrome retracting, and any emulated
     viewport), so a band of this ground shows below each photo. Letting drift
     animate it made that band a colour the scrims below never match, i.e. a
     visible seam. Pinned here and every scrim ends on this exact value. */
  background:#0f1c33; position:relative; z-index:1;
}
#cineIntro h1,#cineIntro h2{color:var(--sc-ink)}

/* BASE STATE — correct with NO JavaScript at all.
   Learned the hard way: the engine bailing (file:// open, a 404 on
   scrollcraft.js, JS disabled, slow load) used to leave the sections with no
   height and the stages non-sticky, so all three .cine-copy blocks anchored to
   #cineIntro and stacked on one screen. The intro must therefore be a correct
   static layout on its own — three full-height panels — and the engine only
   ever UPGRADES it to pinned/scrubbed. Never the other way round. */
/* The page's own `section{padding-block:clamp(90px,11vw,150px)}` also matches
   these act <section>s, which pushed each sticky stage 90px down its own
   section and cut the same 90px off the bottom of the frame — the headline
   clipped against the viewport edge and it looked like the type was too big.
   Acts are full-bleed stages; they carry no section rhythm. */
#cineIntro [data-sc-act]{position:relative;min-height:100svh;padding-block:0}
#cineIntro [data-sc-stage]{position:relative;height:100svh;overflow:clip}
/* scrollcraft.css hides every cue until the engine drives it; with no engine
   that means invisible headlines. Show them in the base state. */
#cineIntro:not(.cine-live) [data-sc-cue]{opacity:1;transform:none}
#cineIntro:not(.cine-live) .sc-split__i{opacity:1;transform:none}
/* The Line bar is meaningless without scroll progress driving it — its
   display:none default lives on its own rule below (same specificity as this
   selector, and later in source order, so setting it here would silently lose). */
#cineIntro.cine-live ~ #cine-line{display:flex}

/* ENHANCED STATE — added by JS only after ScrollCraft.mount() actually
   succeeds. Hands height + stickiness back to the engine. */
#cineIntro.cine-live [data-sc-act]{min-height:0}
#cineIntro.cine-live [data-sc-stage]{position:sticky;top:0;height:100svh}

/* Mobbin pass — the pattern A24, Lightship, VanMoof and Zellerfeld all share:
   copy anchored bottom-left, headline set LARGE against the full frame and
   pulled near the bottom edge, supporting line small so the size contrast does
   the hierarchy. The previous 3.6rem cap read as a caption on a photograph
   rather than a title over one. Tracking tightens as the size grows
   (apple-design §15) — a single letter-spacing value is wrong at one end. */
/* ---- two-frame cards (start -> end), scrubbed by scroll ----
   Each act stacks a start and an end frame. The end frame's opacity is a remap
   of that act's own --sc-p, so the crossfade is SCRUBBED by the wheel rather
   than played on a timer: the requested "1.2s / 0.6s / 1.5s" feels are
   reproduced as the width of the band the crossfade happens in, not as
   durations, because a duration can't be dragged backwards and a scrub can. */
#cineIntro .cine-frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cineIntro .cine-frame--end{opacity:0;will-change:opacity}
/* Card 1 - long smooth interpolation, officer distance -> window. */
#cineAct1 .cine-frame--end{opacity:clamp(0,calc((var(--sc-p,0) - .15) / .60),1)}
/* Card 2 - the whole crossfade is squeezed into a narrow band so the door
   reads as an impact rather than a dissolve. */
#cineAct2 .cine-frame--end{opacity:clamp(0,calc((var(--sc-p,0) - .46) / .12),1)}
/* Card 3 - long hold on the flashlight, late slow cross-fade to the refusal. */
#cineAct3 .cine-frame--end{opacity:clamp(0,calc((var(--sc-p,0) - .55) / .40),1)}
@media (prefers-reduced-motion:reduce){
  /* No scrub: rest on each card's resolved end state. */
  #cineIntro .cine-frame--end{opacity:1}
}
#cineIntro .cine-copy{position:absolute;z-index:20;inset-inline:clamp(20px,6vw,64px);bottom:clamp(2rem,9vh,5rem);max-width:min(92%,52rem)}
#cineIntro .cine-label{display:block;font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--sc-accent);margin-bottom:12px}
#cineIntro .cine-h{font-size:clamp(2.6rem,10.5vw,6.5rem);font-weight:800;line-height:.98;letter-spacing:-.035em;margin:0;text-wrap:balance}
#cineIntro .cine-sub{font-size:clamp(.95rem,2.1vw,1.2rem);color:var(--sc-ink-soft);line-height:1.5;margin:clamp(14px,2.2vh,22px) 0 0;max-width:34ch;letter-spacing:0}
/* Act 2's line is roughly twice the words of the other two; at the full display
   size it wraps to five lines on a phone and swamps the frame. Stepped down as
   a modifier rather than an inline style so the scale stays in one place. */
#cineIntro .cine-h--long{font-size:clamp(2rem,7.4vw,4.6rem);letter-spacing:-.03em}
#cine-line{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;align-items:center;min-height:2.6rem;
  padding:12px clamp(20px,6vw,64px);font-family:ui-monospace,"SF Mono",monospace;font-size:.85rem;letter-spacing:.04em;
  color:var(--sc-accent,#E8B84B);background:rgba(15,28,51,.82);border-top:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:1;transition:opacity 420ms cubic-bezier(.23,1,.32,1);pointer-events:none}
#cine-line.cl-done{opacity:0}
#cine-line .cl-quote{color:rgba(255,255,255,.45);margin-right:8px}
@media (max-width:640px){ #cineIntro .cine-copy{max-width:none} }

/* Nav adapts to the material beneath it (apple-design §12). A cream
   translucent bar over dark photography is both a legibility problem and the
   "light material stacked on light material" mistake; iOS-style chrome takes
   its weight from the content under it. Colour-only transition — no transform,
   nothing that can cost a frame. */
nav{transition:background 320ms var(--ease),border-color 320ms var(--ease)}
nav.nav-dark{background:rgba(15,28,51,.66);border-bottom-color:rgba(255,255,255,.13)}
nav.nav-dark .brand b{color:var(--cream)}
nav.nav-dark .brand svg path{stroke:var(--cream)}
nav.nav-dark .brand svg rect{fill:var(--cream)}
nav.nav-dark .navlinks a{color:#e8eef7}
nav.nav-dark .langpill{border-color:rgba(255,255,255,.45)}
nav.nav-dark .langpill button{color:#e8eef7}
nav.nav-dark .langpill button.on{background:var(--cream);color:var(--navy)}
nav.nav-dark .btn-navcta{background:var(--gold);color:var(--navy)}
nav.nav-dark .btn-navcta:hover{background:var(--gold-pale)}
@media (prefers-reduced-transparency:reduce){
  nav.nav-dark{background:#0f1c33;backdrop-filter:none}
}
@media (prefers-reduced-motion:reduce){ nav{transition:none} }


/* Catch-all for reduced motion, matching index.html. The targeted rules above
   stay -- they express intent for specific pieces -- but an enumerated list only
   covers what someone remembered to enumerate, and every animation added later
   silently escapes it. JS-driven motion is untouched: the arena needle is the
   interaction itself, not decoration. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* iOS paints a grey flash on tap over the page's own press states. Suppressed
   only where a real :active state already exists to take its place. */
.btn,.faq-q,.navburger,.navsheet-close,button,a.btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* The FAQ rows were the one control here with no pressed state, so on a phone
   tapping a question showed nothing until the answer expanded. */
.faq-q:active{background:rgba(232,184,75,.14);transition-duration:60ms}

/* The closed nav drawer is parked off-screen to the right, which extended the
   scrollable area and gave the page 73px of sideways scroll on a 375px phone --
   the whole document could be dragged left, taking the fixed nav with it.
   `clip` rather than `hidden`: hidden turns the root into a scroll container and
   can break position:sticky, clip just trims the overflow. hidden is listed
   first purely as the fallback for engines without clip. */
html{overflow-x:hidden;overflow-x:clip}

/* ---- Staggered scenario grid -------------------------------------------
   The cards already animated in on a 100/200ms delay, but landed on a single
   flat baseline: a three-up auto-fit grid with one uniform gap, which is the
   exact "default card grid, uniform spacing, no hierarchy" this project's own
   design rules ban first. The timing was staggered; the composition was not.

   Offsets are deliberately not a staircase (0/48/96) -- that just reads as a
   tilted row. 0 / 72 / 32 gives the row a rhythm, so the eye moves through the
   three scenarios instead of scanning them as one block.

   Applied only at >=900px, where auto-fit reliably yields three columns. Below
   that the grid collapses toward one column and an offset would show up as
   arbitrary gaps between stacked cards. margin-top (not transform) so the row
   box grows with the offset and cannot collide with the next section. */
@media (min-width:900px){
  .grid-cards > *:nth-child(2){margin-top:72px}
  .grid-cards > *:nth-child(3){margin-top:32px}
}
/* The card had a hover shadow but never moved. Overrides .scen-card.is-in's
   transform:none, which is why this needs the .is-in in the selector. */
.scen-card.is-in{transition:opacity 640ms var(--ease),transform 300ms var(--ease),box-shadow 300ms var(--ease)}
.scen-card.is-in:hover{transform:translateY(-6px)}
@media (prefers-reduced-motion: reduce){
  .scen-card.is-in:hover{transform:none}
}

/* ---- Coverage map -------------------------------------------------------
   Replaces the .ph placeholder box. Sits on the page's own cream/navy/gold
   tokens rather than index.html's picker palette, because here it is a figure
   in a marketing section, not a control in a form. */
.states-map{background:linear-gradient(160deg,#FBF7EE,#F1EADB);padding:clamp(18px,3vw,34px)}
.sm2-map{display:block;width:100%;height:auto}
.sm2{fill:#FFFDF8;stroke:#CFC6AF;stroke-width:1;vector-effect:non-scaling-stroke}
.sm2--cited{fill:var(--gold);stroke:#B9891C;stroke-width:1.4}
.sm2-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
  margin-top:clamp(14px,2vw,22px);font-size:13px;font-weight:700;color:var(--eyebrow)}
.sm2-key{display:inline-flex;align-items:center;gap:8px}
.sm2-sw{width:14px;height:14px;border-radius:4px;background:#FFFDF8;border:1px solid #CFC6AF}
.sm2-sw--cited{background:var(--gold);border-color:#B9891C}
</style>
</head>

<!-- Shared state geometry, same file index.html draws its picker map from, so
     the two maps can never drift apart. Plain tag above the script that reads
     it: window.AmparoPaths must exist before the first render. -->
<script src="../us-paths.js?v=2026-09-02a"></script>

<script>

/* The states section shipped as a grey placeholder box reading "US map -- TX /
   GA / NY highlighted" while a real, working map of exactly that already existed
   in index.html. This draws it from the same shared path data.

   Deliberately NOT interactive: on a marketing page this is a coverage figure,
   not a control, and 51 focusable paths would add a keyboard trap's worth of tab
   stops for no gain. So role="img" with a label that states the same fact the
   shapes do, which is also the whole fallback if the geometry fails to load. */

function statesMapHtml(c){
  var P = window.AmparoPaths;
  if (!P || !Object.keys(P).length) return '';   // never ship an empty grey box
  var paths = Object.keys(P).map(function(k){
    return '<path class="sm2'+(CITED.indexOf(k)>-1?' sm2--cited':'')+'" d="'+P[k]+'"/>';
  }).join('');
  return '<div class="states-map">'+
    '<svg class="sm2-map" viewBox="0 0 959 593" role="img" aria-label="'+esc(c.stateMapAria)+'">'+paths+'</svg>'+
    '<div class="sm2-legend">'+
      '<span class="sm2-key"><i class="sm2-sw"></i>'+esc(c.stateLegendAll)+'</span>'+
      '<span class="sm2-key"><i class="sm2-sw sm2-sw--cited"></i>'+esc(c.stateLegendCited)+'</span>'+
    '</div>'+
  '</div>';
}

function demoStart(){
  demo.on = true;
  try{ localStorage.setItem('amparo_demo_played','1'); }catch(e){}
  render();
}
function currentTurn(){ return demo.branch ? DEMO_BRANCH : DEMO_TURNS[Math.min(demo.t, DEMO_TURNS.length-1)]; }
function demoPick(i){
  if (demo.picked >= 0) return;
  const ch = currentTurn().c[i];
  demo.heat = Math.max(6, Math.min(100, demo.heat + (ch.p===1?-4:ch.p===0?14:26)));
  demo.picked = i;
  demo.score += (ch.p===1?1:0);
  demo.scored += 1;
  render();
}
function demoNext(){
  const ch = currentTurn().c[demo.picked];
  if (!demo.branch && ch && ch.branch){ demo.branch=true; demo.picked=-1; render(); return; }
  const nt = demo.t + 1;
  if (nt >= DEMO_TURNS.length){ demo.done = true; }
  else { demo.branch=false; demo.t=nt; demo.picked=-1; }
  render();
}
function demoRestart(){ demo = {on:true,t:0,branch:false,picked:-1,heat:12,score:0,scored:0,done:false}; render(); }
function toggleFaq(i){ openFaq = (openFaq===i ? -1 : i); render(); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---- scenario card scroll effect ----
   render() rewrites #app's innerHTML on every language toggle and FAQ click, so
   a second ScrollCraft.mount() over this section would be left holding element
   references that no longer exist. Driven here instead: a one-shot clip-path
   wipe on entry (IntersectionObserver) plus a continuous parallax of the image
   inside its own frame (rAF, transform only). Re-armed after each render. */
var scenIo = null, scenRaf = null, scenRevealed = false, scenOnScroll = null;
function armScenCards(){
  var cards = document.querySelectorAll('#arena .scen-card');
  if (!cards.length) return;
  if (scenIo) scenIo.disconnect();

  if ('IntersectionObserver' in window) {
    scenIo = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        e.target.classList.add('is-in');
        // Once seen, later re-renders emit the cards already revealed, so a
        // language toggle mid-page doesn't replay every card animation.
        scenRevealed = true;
        scenIo.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
    cards.forEach(function(c){ scenIo.observe(c); });
  } else {
    cards.forEach(function(c){ c.classList.add('is-in'); });
    scenRevealed = true;
  }

  // Backstop: if the observer somehow never fires (odd viewport maths, a
  // browser quirk), the cards must not stay at opacity 0 forever. Anything
  // still unrevealed after 1.5s is shown outright.
  setTimeout(function(){
    document.querySelectorAll('#arena .scen-card:not(.is-in)').forEach(function(c){
      c.classList.add('is-in');
    });
  }, 1500);

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var imgs = document.querySelectorAll('#arena .scen-media img');
  if (!imgs.length) return;

  function paint(){
    var vh = window.innerHeight;
    for (var i = 0; i < imgs.length; i++){
      var frame = imgs[i].parentElement;
      var r = frame.getBoundingClientRect();
      if (r.bottom < 0 || r.top > vh) continue;   // offscreen: don't touch it
      // -0.5 .. 0.5 as the card crosses the viewport. The frame hides 6% of the
      // image top and bottom, so ±10px never exposes an edge.
      var p = (r.top + r.height / 2 - vh / 2) / vh;
      imgs[i].style.transform = 'translate3d(0,' + (p * -10).toFixed(2) + 'px,0)';
    }
  }
  // Driven by scroll, coalesced into one frame, instead of a rAF loop spinning
  // for the life of the page: the earlier version kept requesting frames even
  // with the section miles offscreen. Listener is rebound per render() and the
  // previous one removed, so repeated renders can't stack handlers.
  if (scenOnScroll){
    window.removeEventListener('scroll', scenOnScroll);
    window.removeEventListener('resize', scenOnScroll);
  }
  var ticking = false;
  scenOnScroll = function(){
    if (ticking) return;
    ticking = true;
    scenRaf = requestAnimationFrame(function(){ paint(); ticking = false; });
  };
  window.addEventListener('scroll', scenOnScroll, { passive: true });
  window.addEventListener('resize', scenOnScroll, { passive: true });
  paint();   // set the resting offsets immediately, don't wait for a scroll
}

function renderNav(c){
  // One source of truth for both the bar and the sheet. Two hand-maintained
  // lists is how a link gets added to the desktop nav and silently never
  // appears on phones.
  const items = [
    ['#arena',        c.navPractice],
    ['rehearse.html', c.navRehearse],
    ['aid.html',      c.navAid],
    ['#how',          c.navHow],
    ['#what',         c.navWhat],
    ['#privacy',      c.navPrivacy],
    ['#faq',          c.navFaq]
  ];
  const html = items.map(function(it){
    return '<a href="'+it[0]+'">'+esc(it[1])+'</a>';
  }).join('');
  document.getElementById('navLinks').innerHTML = html;

  const sheet = document.getElementById('navSheetLinks');
  if (sheet){
    sheet.innerHTML = html;
    // Stagger is applied per link rather than with nth-child rules so the
    // count can change without anyone remembering to update the CSS.
    Array.prototype.forEach.call(sheet.children, function(a, i){
      a.style.transitionDelay = (60 + i * 34) + 'ms';
    });
  }
  const sheetCta = document.getElementById('navSheetCta');
  if (sheetCta && c.navCta) sheetCta.textContent = c.navCta;
}

/* ===== mobile nav sheet =====
   Focus is trapped while open, Escape closes, the page behind is locked, and
   focus returns to the trigger on close. A nav you can tab out of into an
   invisible page is not reachable for a keyboard or screen-reader user, which
   is the same failure the missing hamburger caused for everyone else. */
(function(){
  const burger = document.getElementById('navBurger');
  const sheet  = document.getElementById('navSheet');
  const scrim  = document.getElementById('navScrim');
  const closeB = document.getElementById('navClose');
  if (!burger || !sheet || !scrim) return;

  let open = false, lastFocus = null, scrollY = 0;

  function focusables(){
    return sheet.querySelectorAll('a[href], button:not([disabled])');
  }

  // visibility:hidden already removes the panel from the tab order in every
  // engine that matters, but inert also blocks pointer and AT access on the
  // browsers that support it, and costs nothing on the ones that don't.
  function setInert(v){
    if ('inert' in sheet) sheet.inert = v;
  }
  setInert(true);

  function setOpen(next){
    if (next === open) return;
    open = next;
    burger.setAttribute('aria-expanded', String(open));

    if (open){
      lastFocus = document.activeElement;
      scrollY = window.scrollY;
      setInert(false);
      sheet.classList.add('is-open'); scrim.classList.add('is-open');
      // position:fixed rather than overflow:hidden -- iOS Safari ignores
      // overflow:hidden on body and scrolls the page behind the sheet anyway.
      document.body.style.position = 'fixed';
      document.body.style.top = (-scrollY) + 'px';
      document.body.style.width = '100%';
      const f = focusables()[0];
      if (f) f.focus();
    } else {
      sheet.classList.remove('is-open'); scrim.classList.remove('is-open');
      setInert(true);
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, scrollY);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
  }

  burger.addEventListener('click', function(){ setOpen(!open); });
  scrim.addEventListener('click', function(){ setOpen(false); });
  if (closeB) closeB.addEventListener('click', function(){ setOpen(false); });

  // Any navigation closes it, including same-page hash links, which otherwise
  // scroll the page underneath a sheet that is still covering it.
  sheet.addEventListener('click', function(e){
    if (e.target.closest('a')) setOpen(false);
  });

  document.addEventListener('keydown', function(e){
    if (!open) return;
    if (e.key === 'Escape'){ setOpen(false); return; }
    if (e.key !== 'Tab') return;
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  // Returning to desktop width with the sheet open would otherwise leave the
  // body locked at position:fixed with no visible way to release it.
  window.addEventListener('resize', function(){
    if (open && window.innerWidth > 900) setOpen(false);
  });
})();

function renderDemoPhone(c){
  const dTurn = currentTurn();
  const heatColor = demo.heat > 60 ? '#e07a5f' : '#E8B84B';
  const mood = demo.heat > 60 ? c.demoMoodTense : c.demoMoodCalm;
  let body = '';
  if (!demo.on){
    body = '<div class="demo-idle">'+
      '<p class="demo-scene">'+esc(c.demoScene)+'</p>'+
      '<p class="demo-note">'+esc(c.demoStartNote)+'</p>'+
      '<button class="btn btn-gold" onclick="demoStart()">'+esc(c.demoStartLabel)+' →</button>'+
      '</div>';
  } else if (!demo.done){
    const isLast = !demo.branch && demo.t === DEMO_TURNS.length-1;
    let choicesHtml = dTurn.c.map((ch,i)=>{
      let cls = 'choice';
      let disabled = '';
      if (demo.picked >= 0){
        disabled = 'disabled';
        if (demo.picked === i) cls += ch.p===1?' good':ch.p===0?' warn':' bad';
        else cls += ' dim';
      }
      return '<button class="'+cls+'" '+disabled+' onclick="demoPick('+i+')">'+esc(ch.t[lang])+'</button>';
    }).join('');
    let feedbackHtml = '';
    if (demo.picked >= 0){
      const picked = dTurn.c[demo.picked];
      const fkind = picked.p===1?'good':picked.p===0?'warn':'bad';
      feedbackHtml = '<div class="feedback '+fkind+'">'+esc(picked.f[lang])+'</div>'+
        '<button class="btn-next" onclick="demoNext()">'+esc(isLast?c.demoResultsLabel:c.demoNextLabel)+' →</button>';
    }
    body = '<div class="officer-row"><div class="officer-label">'+esc(c.demoOfficerLabel)+'</div>'+
      '<div class="officer-line">'+esc(dTurn.o[lang])+'</div></div>'+
      '<div class="choices">'+choicesHtml+'</div>'+feedbackHtml;
  } else {
    body = '<div class="demo-done">'+
      '<div class="demo-done-title">'+esc(c.demoDoneTitle)+'</div>'+
      '<div class="score-pill">'+(lang==='en'?'Safe answers: ':'Respuestas seguras: ')+demo.score+(lang==='en'?' of ':' de ')+demo.scored+'</div>'+
      '<p class="demo-done-note">'+esc(c.demoDoneNote)+'</p>'+
      '<a class="done-cta" href="https://www.amparohq.com/arena" target="_blank" rel="noopener">'+esc(c.demoDoneCta)+' →</a>'+
      '<button class="restart-link" onclick="demoRestart()">'+esc(c.demoRestartLabel)+'</button>'+
      '</div>';
  }
  const dots = DEMO_TURNS.map((_,i)=>{
    const cur = i===demo.t && !demo.done;
    const doneDot = i<demo.t || demo.done;
    return '<div class="dot" style="background:'+(cur?'#F3D48A':doneDot?'rgba(243,212,138,.55)':'rgba(255,255,255,.22)')+'"></div>';
  }).join('');

  return '<div class="demo-wrap"><div class="demo-glow" aria-hidden="true"></div>'+
    '<div class="demo-inner"><div class="phone"><div class="screen">'+
    '<div class="screen-head"><span class="screen-title">'+esc(c.demoTitle)+'</span><span class="mood">'+esc(mood)+'</span></div>'+
    '<div class="heat-track"><div class="heat-fill" style="width:'+demo.heat+'%;background:'+heatColor+'"></div></div>'+
    body+
    '<div class="dots">'+dots+'</div>'+
    '</div></div>'+
    '<p class="demo-caption">'+esc(c.demoCaption)+'</p>'+
    '<p class="demo-state-note">'+esc(c.demoStateNote)+'</p>'+
    '</div></div>';
}

          line:['I','choose','to','remain','silent.','I','want','a','lawyer.'] },
    es: { label:'Amparo', h1:'Luces en el espejo.', sub1:'Todo conductor ha sentido este medio segundo exacto.',
          h2:'No es la placa lo que le hace olvidar sus derechos.', sub2:'Es su propia mente, en blanco, a media frase.',
          h3:'Las palabras salen sin pensar.', sub3:'Porque las practicó primero.',
          line:['Elijo','guardar','silencio.','Quiero','un','abogado.'] }
  };

  function set(id, text){ var el = document.getElementById(id); if (el) el.textContent = text; }

  // A `let lang` in the page's own top-level script does not attach to
  // `window` (confirmed the same way on the live site's index.html), so
  // the current language is read off the toggle's .on class instead of a
  // cross-script variable — decoupled from how the main script happens to
  // store it, and correct on first paint before setLang() ever runs.
  var curLang = 'en';
  function detectLang(){
    var es = document.getElementById('langES');
    return (es && es.classList.contains('on')) ? 'es' : 'en';
  }
  window.renderCine = function(l){
    curLang = l || detectLang();
    var c = CINE[curLang === 'es' ? 'es' : 'en'];
    set('cineLabel1', c.label); set('cineH1', c.h1); set('cineSub1', c.sub1);
    set('cineH2', c.h2); set('cineSub2', c.sub2);
    set('cineH3', c.h3); set('cineSub3', c.sub3);
  };
  renderCine();

  // Nav takes its material from what's under it (see nav.nav-dark in CSS).
  // Runs whether or not the scroll engine mounts — it's page chrome, not part
  // of the intro's enhancement.
  (function navMaterial(){
    var nav = document.querySelector('nav');
    var intro = document.getElementById('cineIntro');
    if (!nav || !intro || !('IntersectionObserver' in window)) return;
    // Shrink the root's top edge by the nav's own height: the intro "intersects"
    // exactly while it is still passing behind the bar.
    var h = Math.round(nav.getBoundingClientRect().height) || 72;
    new IntersectionObserver(function(entries){
      nav.classList.toggle('nav-dark', entries[0].isIntersecting);
    }, { rootMargin: '-' + h + 'px 0px 0px 0px', threshold: 0 }).observe(intro);
  })();

  var mounted = false;
  function mountCine(){
    if (mounted) return;
    var intro = document.getElementById('cineIntro');
    if (!intro) return;
    if (!window.ScrollCraft){
      // Loud, not silent. The old silent bail left the page rendering three
      // stacked headlines on one screen with no clue why.
      console.warn('[amparo] scrollcraft engine unavailable — cinematic intro ' +
        'staying in its static CSS fallback (3 full-height panels, no pinning).');
      return;
    }
    mounted = true;
    // Hand layout control over BEFORE mounting: the engine checks that each
    // stage computes position:sticky during mount(), and the base-state rule
    // (#cineIntro [data-sc-stage]{position:relative}) outranks .sc-stage until
    // .cine-live is present — mounting first produced a "will not pin" warning
    // on every act even though it worked a frame later. Rolled back if the
    // engine throws, so a hard failure still lands in the static fallback.
    intro.classList.add('cine-live');
    try {
      ScrollCraft.mount(intro);
    } catch (err) {
      intro.classList.remove('cine-live');
      mounted = false;
      console.warn('[amparo] scrollcraft mount failed — cinematic intro staying ' +
        'in its static CSS fallback.', err);
      return;
    }

    // Signature move — "The Line": accumulates the real Arena line
    // ("those nine words", see arena/index.html) word by word, tied to
    // summed scroll progress across the 3 acts above. Ported unchanged
    // from index.html's own scroll intro.
    var acts = ['cineAct1','cineAct2','cineAct3'].map(function(id){ return document.getElementById(id); });
    var bar = document.getElementById('cine-line');
    var out = document.getElementById('cineLineWords');
    if (!bar || !out) return;
    var lastN = -1;
    function tick(){
      var words = CINE[curLang === 'es' ? 'es' : 'en'].line;
      var sum = 0;
      for (var i = 0; i < acts.length; i++){
        var el = acts[i]; if (!el) continue;
        sum += parseFloat(el.style.getPropertyValue('--sc-p')) || 0;
      }
      var best = sum / acts.length;
      var n = Math.max(0, Math.min(words.length, Math.round(best * words.length)));
      if (n !== lastN || lastN === -1){ out.textContent = words.slice(0, n).join(' '); lastN = n; }
      bar.classList.toggle('cl-done', best >= 0.995);
    }
    // Driven by scroll, not by a permanent rAF loop. --sc-p only changes when the
    // page scrolls, so a self-perpetuating loop repainted nothing 60 times a
    // second for as long as the tab stayed open -- the page never reached render
    // idle, which costs battery on a phone and is exactly the kind of background
    // churn that makes scrolling stutter. rAF-coalesced so a burst of scroll
    // events still does at most one update per frame.
    var queued = false;
    function onScroll(){
      if (queued) return;
      queued = true;
      requestAnimationFrame(function(){ queued = false; tick(); });
    }
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll, { passive: true });
    tick();
  }
  // scrollcraft.js is a plain (non-async) script tag directly above this one,
  // so if it loaded at all it is already defined — waiting for window.load was
  // a pointless extra failure path. The engine re-splits kinetic lines on
  // document.fonts.ready itself, and act heights are viewport-based, so there
  // is nothing here that needs images to have finished.
  mountCine();
})();
</script>
</body>
</html>
