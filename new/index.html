/* ===================================================================
   Amparo homepage, "The Deal". Rhythmic cutlist: fourteen short opaque
   grounds, hard cuts, nothing pinned, one peak held in the chrome layer.
   Six colours, the brand's own face. Everything in scrollcraft.css derives
   from these tokens; the page paints its own grounds per section because a
   cut is not an interpolation.
   =================================================================== */
:root{
  --sc-canvas:#0B1426; --sc-surface:#16223A; --sc-ink:#FAF6EE; --sc-ink-soft:#A9B7D4;
  --sc-accent:#E8B84B; --sc-accent-ink:#1B2A4A;
  --sc-font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
  --sc-font-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  --navy:#1B2A4A; --navy-deep:#0B1426; --gold:#E8B84B; --cream:#FAF6EE; --ease:cubic-bezier(.23,1,.32,1);
  --bar-h:64px;
}
html{overflow-x:hidden;overflow-x:clip;scroll-behavior:auto}
body{margin:0;background:var(--sc-canvas);color:var(--sc-ink);font-family:var(--sc-font-text);
  -webkit-font-smoothing:antialiased;letter-spacing:.005em}
*{box-sizing:border-box}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
::selection{background:var(--gold);color:var(--navy)}

/* ---------- The bar: loud, full width, CTA at the wordmark's weight ---------- */
nav.bar{position:fixed;top:0;left:0;right:0;z-index:70;height:var(--bar-h);
  display:flex;align-items:center;gap:20px;padding:0 clamp(16px,3vw,32px);
  background:rgba(11,20,38,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid rgba(250,246,238,.10);box-shadow:inset 0 1px 0 rgba(250,246,238,.06)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--cream)}
.brand svg{width:30px;height:30px}
.navlinks{display:flex;gap:4px;margin-left:8px}
.navlinks a{font-size:13.5px;font-weight:700;color:var(--sc-ink-soft);text-decoration:none;padding:8px 11px;border-radius:99px;transition:color 140ms var(--ease),background 140ms var(--ease)}
.navlinks a:hover{color:var(--cream);background:rgba(250,246,238,.07)}
.navright{margin-left:auto;display:flex;align-items:center;gap:10px}
.langpill{display:inline-flex;border:1.5px solid rgba(250,246,238,.22);border-radius:99px;overflow:hidden}
.langpill button{padding:7px 12px;border:0;background:transparent;color:var(--sc-ink-soft);cursor:pointer;font-weight:800;font-size:12.5px;font-family:inherit}
.langpill button.on{background:var(--cream);color:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:800;border-radius:99px;border:0;cursor:pointer;font-family:inherit;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform 140ms var(--ease),background 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-navcta{background:var(--gold);color:var(--navy);font-size:14px;padding:11px 18px}
.btn-navcta:hover{background:#F2C86A}
.btn-deal{background:transparent;color:var(--cream);font-size:13.5px;padding:10px 16px;border:1.5px solid rgba(232,184,75,.65)}
.btn-deal:hover{background:rgba(232,184,75,.12)}
.btn-deal .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:11px}
.navburger{display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1.5px solid rgba(250,246,238,.3);border-radius:14px;background:transparent;cursor:pointer;flex-direction:column;gap:5px}
.navburger span{display:block;width:18px;height:2px;background:var(--cream);border-radius:2px}
@media (max-width:900px){ .navlinks{display:none} .navburger{display:flex} nav.bar .navright .langpill{display:none} .btn-deal .t{display:none} .btn-deal{padding:10px 12px} .btn-navcta{display:none} }

/* sheet (mobile menu), kept from the previous build, re-inked to the dark bar */
.navscrim{position:fixed;inset:0;z-index:60;background:rgba(7,14,28,.6);opacity:0;visibility:hidden;transition:opacity 300ms var(--ease),visibility 0s linear 300ms}
.navscrim.is-open{opacity:1;visibility:visible;transition:opacity 300ms var(--ease),visibility 0s}
.navsheet{position:fixed;z-index:61;top:0;right:0;height:100dvh;width:min(86vw,380px);max-width:100vw;background:#0F1B33;color:var(--cream);
  transform:translateX(100%);visibility:hidden;transition:transform 420ms var(--ease),visibility 0s linear 420ms;display:flex;flex-direction:column;padding:18px 22px 28px;border-left:1px solid rgba(250,246,238,.1)}
.navsheet.is-open{transform:translateX(0);visibility:visible;transition:transform 420ms var(--ease),visibility 0s}
.navsheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.navSheetLabel{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.navsheet-close{width:44px;height:44px;border-radius:14px;border:1.5px solid rgba(250,246,238,.3);background:transparent;color:var(--cream);font-size:22px;cursor:pointer}
.navsheet-links{position:static;inset:auto;z-index:auto;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;padding:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border:0;height:auto}
.navsheet-links a{display:block;padding:15px 4px;font-size:18px;font-weight:800;text-decoration:none;color:var(--cream);border-bottom:1px solid rgba(250,246,238,.1)}
.navsheet-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.navsheet .langpill{align-self:flex-start}

/* ---------- Cuts ---------- */
.cut{position:relative;min-height:calc(var(--h,1) * 100svh);display:grid;align-items:end;padding:calc(var(--bar-h) + 24px) clamp(20px,6vw,72px) clamp(28px,6vh,64px);overflow:hidden;isolation:isolate}
.cut--lead{align-items:end;justify-items:start}
.cut--trail{align-items:end;justify-items:end;text-align:right}
.cut--centre{align-items:center;justify-items:center;text-align:center}
.cut--top{align-items:start;justify-items:start}
/* the peak: copy top-right behind glass, the hand pushed left, so a fanned
   card never passes under the sub line (1.76:1 at one reduced-motion frame) */
.cut--top-trail{justify-items:end;text-align:right}
/* The glass is a SIBLING behind the copy, never the copy's own background: the
   verification pass hides the copy to photograph the frame under it, so a
   background on the copy is hidden too and never measured (three identical
   1.87:1 readings before this). */
.peak-panel{position:relative;z-index:2;max-width:min(30vw,440px);justify-self:end}
.peak-glass{position:absolute;inset:0;border-radius:16px;background:rgba(7,14,28,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(250,246,238,.08)}
.cut--top-trail .copy{position:relative;max-width:none;padding:16px 20px}
.cut--top-trail .copy p{margin-left:auto;color:var(--sc-ink)}  /* outranks .cut p, declared later */
@media (max-width:860px){ .cut--top-trail{justify-items:start;text-align:left} .peak-panel{max-width:92vw;justify-self:start} .cut--top-trail p{margin-left:0} }
.cut .copy{position:relative;z-index:2;max-width:min(92vw,720px)}
.cut h1,.cut h2{font-family:var(--sc-font-display);font-weight:800;line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.cut h1{font-size:clamp(2.6rem,7.5vw,5.8rem)}
.cut h2{font-size:clamp(2rem,5.2vw,4.2rem)}
.cut p{font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.6;letter-spacing:.01em;color:var(--sc-ink-soft);margin:14px 0 0;max-width:38ch;text-wrap:pretty}
.cut--trail p{margin-left:auto}
.cut--centre p{margin-left:auto;margin-right:auto}
.cut .eyebrow{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.plate{position:absolute;inset:0;z-index:0;margin:0}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
/* act 1: the mirror still is 9:16; a landscape cover crop shows its middle
   band, and the red/blue flares sit just below it, under the lead copy. Raise
   the crop so they fall out of frame instead of fighting the scrim. */
/* act 1 copy sits top-left over the dark headliner; the mirror and its lights
   stay centred and the flares in the lower corners never meet the type */
/* density where the copy sits, not over the whole frame. Siblings of the copy,
   never children, so the harness can measure them. */
.scrim-lead{position:absolute;left:0;bottom:0;width:min(78vw,860px);height:72%;z-index:1;pointer-events:none;
  background:radial-gradient(125% 105% at 0% 100%,rgba(11,20,38,.97) 0%,rgba(11,20,38,.82) 40%,rgba(11,20,38,.4) 68%,rgba(11,20,38,0) 88%)}
.scrim-trail{position:absolute;right:0;bottom:0;width:min(78vw,860px);height:72%;z-index:1;pointer-events:none;
  background:radial-gradient(125% 105% at 100% 100%,rgba(11,20,38,.97) 0%,rgba(11,20,38,.82) 40%,rgba(11,20,38,.4) 68%,rgba(11,20,38,0) 88%)}
.scrim-top{position:absolute;left:0;top:0;width:min(78vw,860px);height:64%;z-index:1;pointer-events:none;
  background:radial-gradient(125% 105% at 0% 0%,rgba(7,14,28,.96) 0%,rgba(7,14,28,.8) 40%,rgba(7,14,28,.38) 68%,rgba(7,14,28,0) 88%)}
@media (max-width:860px){ .scrim-lead,.scrim-trail{width:100%;height:74%;background:linear-gradient(to top,rgba(11,20,38,.97) 0%,rgba(11,20,38,.7) 50%,rgba(11,20,38,0) 100%)} .scrim-top{width:100%;height:60%;background:linear-gradient(to bottom,rgba(7,14,28,.97) 0%,rgba(7,14,28,.7) 50%,rgba(7,14,28,0) 100%)} }
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.cut--trail .hero-ctas{justify-content:flex-end}
.btn-gold{background:var(--gold);color:var(--navy);font-size:15px;padding:14px 24px}
.btn-gold:hover{background:#F2C86A}
.btn-line{background:transparent;color:var(--cream);font-size:15px;padding:14px 22px;border:1.5px solid rgba(250,246,238,.35)}
.btn-line:hover{border-color:var(--cream)}
.trust{font-size:13px;color:var(--sc-ink-soft);margin-top:16px;max-width:52ch}

/* act 5: one real turn */
.turn{display:grid;gap:14px;max-width:640px}
.turn .who{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--sc-ink-soft)}
.turn .o{font-size:clamp(1.25rem,2.6vw,2rem);font-weight:800;line-height:1.2;letter-spacing:-.02em;color:var(--cream);margin:0;max-width:none}
.turn .r{font-size:clamp(1.1rem,2.1vw,1.5rem);line-height:1.3;color:var(--gold);margin:0;padding:16px 18px;border-left:2px solid var(--gold);background:rgba(232,184,75,.06);max-width:none}
.turn .f{font-size:14px;color:var(--sc-ink-soft);margin:0}

/* act 8: one card face, large */
.face-stage{position:absolute;inset:0;display:grid;place-items:center;z-index:0;margin:0}
.face-stage .card{position:static;width:min(76vw,520px);margin:0;transform:rotate(-4deg)}
.face-stage--right{place-items:center end;padding-right:clamp(16px,6vw,96px)}
.face-stage--right .card{width:min(34vw,460px)}
/* the copy column stops well short of the card, so cream type never sits on
   a cream card at any width (1.02:1 at the worst frame before this) */
#what .copy{max-width:min(42vw,540px)}
@media (max-width:860px){ .face-stage--right{place-items:start center;padding:calc(var(--bar-h) + 12px) 0 0} .face-stage .card{width:min(60vw,320px)} }

/* act 9: the map */
.map-stage{position:absolute;inset:var(--bar-h) 0 18%;display:grid;place-items:start center;z-index:0;padding:2vh clamp(12px,4vw,48px) 0}
.map-stage figure{margin:0;width:min(100%,980px)}
.sm2-map{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.sm2{fill:#16223A;stroke:#2B3A5C;stroke-width:1;vector-effect:non-scaling-stroke}
.sm2--cited{fill:var(--gold);stroke:#B9891C;stroke-width:1.4}
.sm2-legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--sc-ink-soft)}
.sm2-key{display:inline-flex;align-items:center;gap:8px}
.sm2-sw{width:12px;height:12px;border-radius:3px;background:#16223A;border:1px solid #2B3A5C}
.sm2-sw--cited{background:var(--gold);border-color:#B9891C}
.cut--map .copy{max-width:520px}

/* act 10: lock */
.lock{width:52px;height:52px;border-radius:16px;border:1.5px solid rgba(232,184,75,.6);display:grid;place-items:center;margin:0 auto 18px}

/* act 11: the other language */
.cut--es{background:#101B33}
.cut--es .copy{max-width:720px}
.pair{display:inline-flex;gap:6px;border:1.5px solid rgba(250,246,238,.22);border-radius:99px;padding:4px;margin-bottom:18px}
.pair span{padding:6px 14px;border-radius:99px;font-weight:800;font-size:12.5px;color:var(--sc-ink-soft)}
.pair span.on{background:var(--gold);color:var(--navy)}

/* act 12: share */
.share-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* faq: compressed, administrative */
.faq{padding:clamp(28px,4vh,40px) clamp(20px,6vw,72px);background:#0B1426;border-top:1px solid rgba(250,246,238,.08)}
.faq-in{max-width:760px;margin:0 auto}
.faq h2{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;letter-spacing:-.02em;margin:0 0 18px}
.faq-item{border-bottom:1px solid rgba(250,246,238,.1)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;background:none;border:0;color:var(--cream);font-family:inherit;font-weight:700;font-size:15.5px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.faq-q:active{opacity:.8}
.faq-icon{color:var(--gold);font-size:20px;transition:transform 200ms var(--ease)}
.faq-icon.open{transform:rotate(45deg)}
.faq-a{margin:0 0 16px;font-size:14.5px;line-height:1.6;color:var(--sc-ink-soft);max-width:62ch}

/* act 13: the close. The one inversion on the page: gold ground, navy ink.
   Restating color on the subtree, because the token alone would not re-ink
   text whose colour already resolved on body. */
.cut--close{--sc-ink:#1B2A4A;--sc-ink-soft:#5B4A1C;color:var(--sc-ink);background:var(--gold);align-items:center;justify-items:center;text-align:center;min-height:100svh}
.cut--close h2{color:var(--navy);font-size:clamp(2.2rem,6vw,4.8rem)}
.cut--close p{color:#5B4A1C;margin-left:auto;margin-right:auto}
.cut--close .btn-gold{background:var(--navy);color:var(--cream)}
.cut--close .btn-gold:hover{background:#0B1426}
.cut--close .btn-line{color:var(--navy);border-color:rgba(27,42,74,.5)}
.cut--close .btn-line:hover{border-color:var(--navy)}
.cut--close .hero-ctas{justify-content:center}
.cut--close ::selection{background:var(--navy);color:var(--gold)}
footer.colophon{width:100%;margin-top:clamp(36px,8vh,72px);display:flex;flex-wrap:wrap;gap:14px 26px;justify-content:center;font-size:12.5px;color:#5B4A1C}
footer.colophon a{color:var(--navy);text-decoration:none;font-weight:700}
footer.colophon .disc{flex-basis:100%;max-width:70ch;line-height:1.5;text-wrap:pretty;margin:0}

/* ---------- The Deal: six real cards in the chrome layer ---------- */
#deal{position:fixed;inset:0;z-index:65;pointer-events:none;display:grid;place-items:center;perspective:1200px}
#deal.is-live{pointer-events:auto}
#deal:not(.is-live) .hand{visibility:hidden}
#deal .deal-bg{position:absolute;inset:0;background:rgba(7,14,28,0);transition:background 260ms var(--ease);pointer-events:none}
#deal.is-open .deal-bg{background:rgba(7,14,28,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);pointer-events:auto}
.hand{--fan-scale:1;position:relative;width:min(92vw,900px);height:min(70svh,560px);transform-style:preserve-3d;transform:translateX(-11vw)}
@media (max-width:860px){ .hand{transform:none} }
.card{position:absolute;left:50%;top:60%;width:min(64vw,300px);aspect-ratio:63/88;margin-left:calc(min(64vw,300px) / -2);margin-top:calc(min(64vw,300px) * 88 / 63 / -1);
  transform-origin:50% 118%;will-change:transform;
  background:linear-gradient(160deg,#FFFDF8,#F3EEE0);color:var(--navy);border-radius:16px;padding:18px 18px 16px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 22px 44px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  display:flex;flex-direction:column;gap:10px;user-select:none;touch-action:none;cursor:grab}
.card:active{cursor:grabbing}
.card .band{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#7A6A3C}
.card .band b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:11px;letter-spacing:0}
.card h3{font-family:var(--sc-font-display);font-weight:800;font-size:clamp(1.05rem,2.3vw,1.4rem);line-height:1.12;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.card .s{font-size:12.5px;line-height:1.45;color:#4A5568;margin:0;text-wrap:pretty}
.card .fold{margin-top:auto;border-top:1px dashed #C9BE9E;padding-top:8px;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#9A8B5C;display:flex;justify-content:space-between}
.card--cta{background:var(--navy);color:var(--cream);border:1.5px solid rgba(232,184,75,.6)}
.card--cta .band{color:var(--gold)}
.card--cta h3{color:var(--cream)}
.card--cta .s{color:var(--sc-ink-soft)}
.card--cta .go{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:14px;padding:12px 16px;border-radius:99px;text-decoration:none}
/* visibility, not just opacity: an invisible Close button was still in the
   tab order, which is a keyboard user landing on a control they cannot see */
.deal-ui{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:14px;opacity:0;visibility:hidden;transition:opacity 200ms var(--ease),visibility 0s linear 200ms;pointer-events:none}
#deal.is-open .deal-ui{opacity:1;visibility:visible;transition:opacity 200ms var(--ease),visibility 0s;pointer-events:auto}
.deal-ui .hint{font-size:12.5px;color:var(--sc-ink-soft)}
.deal-ui button{background:transparent;color:var(--cream);border:1.5px solid rgba(250,246,238,.35);border-radius:99px;padding:8px 14px;font-weight:800;font-size:12.5px;cursor:pointer;font-family:inherit}

/* The states section shipped as a grey placeholder box reading "US map -- TX /
   GA / NY highlighted" while a real, working map of exactly that already existed
   in index.html. This draws it from the same shared path data.

   Deliberately NOT interactive: on a marketing page this is a coverage figure,
   not a control, and 51 focusable paths would add a keyboard trap's worth of tab
   stops for no gain. So role="img" with a label that states the same fact the
   shapes do, which is also the whole fallback if the geometry fails to load. */
var CITED = ['TX','GA','NY'];
function statesMapHtml(c){
  var P = window.AmparoPaths;
  if (!P || !Object.keys(P).length) return '';   // never ship an empty grey box
  var paths = Object.keys(P).map(function(k){
    return '<path class="sm2'+(CITED.indexOf(k)>-1?' sm2--cited':'')+'" d="'+P[k]+'"/>';
  }).join('');
  return '<div class="states-map">'+
    '<svg class="sm2-map" viewBox="0 0 959 593" role="img" aria-label="'+esc(c.stateMapAria)+'">'+paths+'</svg>'+
    '<div class="sm2-legend">'+
      '<span class="sm2-key"><i class="sm2-sw"></i>'+esc(c.stateLegendAll)+'</span>'+
      '<span class="sm2-key"><i class="sm2-sw sm2-sw--cited"></i>'+esc(c.stateLegendCited)+'</span>'+
    '</div>'+
  '</div>';
}

function currentTurn(){ return demo.branch ? DEMO_BRANCH : DEMO_TURNS[Math.min(demo.t, DEMO_TURNS.length-1)]; }
function demoPick(i){
  if (demo.picked >= 0) return;
  const ch = currentTurn().c[i];
  demo.heat = Math.max(6, Math.min(100, demo.heat + (ch.p===1?-4:ch.p===0?14:26)));
  demo.picked = i;
  demo.score += (ch.p===1?1:0);
  demo.scored += 1;
  render();
}
function demoNext(){
  const ch = currentTurn().c[demo.picked];
  if (!demo.branch && ch && ch.branch){ demo.branch=true; demo.picked=-1; render(); return; }
  const nt = demo.t + 1;
  if (nt >= DEMO_TURNS.length){ demo.done = true; }
  else { demo.branch=false; demo.t=nt; demo.picked=-1; }
  render();
}

/* ---- scenario card scroll effect ----
   render() rewrites #app's innerHTML on every language toggle and FAQ click, so
   a second ScrollCraft.mount() over this section would be left holding element
   references that no longer exist. Driven here instead: a one-shot clip-path
   wipe on entry (IntersectionObserver) plus a continuous parallax of the image
   inside its own frame (rAF, transform only). Re-armed after each render. */
function renderNav(c){
  // One source of truth for both the bar and the sheet. Two hand-maintained
  // lists is how a link gets added to the desktop nav and silently never
  // appears on phones.
  const items = [
    ['#arena',        c.navPractice],
    ['/new/rehearse.html', c.navRehearse],
    ['/new/aid.html',      c.navAid],
    ['#how',          c.navHow],
    ['#what',         c.navWhat],
    ['#privacy',      c.navPrivacy],
    ['#faq',          c.navFaq]
  ];
  const html = items.map(function(it){
    return '<a href="'+it[0]+'">'+esc(it[1])+'</a>';
  }).join('');
  document.getElementById('navLinks').innerHTML = html;

  const sheet = document.getElementById('navSheetLinks');
  if (sheet){
    sheet.innerHTML = html;
    // Stagger is applied per link rather than with nth-child rules so the
    // count can change without anyone remembering to update the CSS.
    Array.prototype.forEach.call(sheet.children, function(a, i){
      a.style.transitionDelay = (60 + i * 34) + 'ms';
    });
  }
  const sheetCta = document.getElementById('navSheetCta');
  if (sheetCta && c.navCta) sheetCta.textContent = c.navCta;
}

/* ===== mobile nav sheet =====
   Focus is trapped while open, Escape closes, the page behind is locked, and
   focus returns to the trigger on close. A nav you can tab out of into an
   invisible page is not reachable for a keyboard or screen-reader user, which
   is the same failure the missing hamburger caused for everyone else. */
(function(){
  const burger = document.getElementById('navBurger');
  const sheet  = document.getElementById('navSheet');
  const scrim  = document.getElementById('navScrim');
  const closeB = document.getElementById('navClose');
  if (!burger || !sheet || !scrim) return;

  let open = false, lastFocus = null, scrollY = 0;

  function focusables(){
    return sheet.querySelectorAll('a[href], button:not([disabled])');
  }

  // visibility:hidden already removes the panel from the tab order in every
  // engine that matters, but inert also blocks pointer and AT access on the
  // browsers that support it, and costs nothing on the ones that don't.
  function setInert(v){
    if ('inert' in sheet) sheet.inert = v;
  }
  setInert(true);

  function setOpen(next){
    if (next === open) return;
    open = next;
    burger.setAttribute('aria-expanded', String(open));

    if (open){
      lastFocus = document.activeElement;
      scrollY = window.scrollY;
      setInert(false);
      sheet.classList.add('is-open'); scrim.classList.add('is-open');
      // position:fixed rather than overflow:hidden -- iOS Safari ignores
      // overflow:hidden on body and scrolls the page behind the sheet anyway.
      document.body.style.position = 'fixed';
      document.body.style.top = (-scrollY) + 'px';
      document.body.style.width = '100%';
      const f = focusables()[0];
      if (f) f.focus();
    } else {
      sheet.classList.remove('is-open'); scrim.classList.remove('is-open');
      setInert(true);
      document.body.style.position = '';
      document.body.style.top = '';
      document.body.style.width = '';
      window.scrollTo(0, scrollY);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }
  }

  burger.addEventListener('click', function(){ setOpen(!open); });
  scrim.addEventListener('click', function(){ setOpen(false); });
  if (closeB) closeB.addEventListener('click', function(){ setOpen(false); });

  // Any navigation closes it, including same-page hash links, which otherwise
  // scroll the page underneath a sheet that is still covering it.
  sheet.addEventListener('click', function(e){
    if (e.target.closest('a')) setOpen(false);
  });

  document.addEventListener('keydown', function(e){
    if (!open) return;
    if (e.key === 'Escape'){ setOpen(false); return; }
    if (e.key !== 'Tab') return;
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });

  // Returning to desktop width with the sheet open would otherwise leave the
  // body locked at position:fixed with no visible way to release it.
  window.addEventListener('resize', function(){
    if (open && window.innerWidth > 900) setOpen(false);
  });
})();

    '<section class="cut cut--close" id="join" data-sc-act="flow" style="--h:1">'+
      '<div class="copy" data-sc-cue="0.05"><h2>'+esc(c.closeTitle)+'</h2><p>'+esc(c.closeSub)+'</p>'+
        '<div class="hero-ctas"><a class="btn btn-gold" href="/arena/">'+esc(c.finalBtn)+'</a><a class="btn btn-line" href="/pack">'+esc(c.dealPrint)+'</a></div>'+
        '<footer class="colophon"><a href="/pack">'+esc(c.navHow)+'</a><a href="#privacy">'+esc(c.navPrivacy)+'</a><a href="https://www.amparohq.com/about">'+esc(c.arenaLink||'About')+'</a><a href="/new/aid.html">'+esc(c.navAid)+'</a>'+
        '<p class="disc">'+esc(c.footerDisclaimer)+'</p><span>'+esc(c.footerCopyright)+'</span></footer></div>'+
    '</section>';

  // the deck faces, in the current language
  const hand = document.getElementById('hand');
  hand.innerHTML = c.dealCards.slice(0,5).map((k,i)=>faceHtml(k,'',' data-i="'+i+'"')).join('') +
    '<article class="card card--cta" data-i="5"><div class="band"><span>Amparo</span><b>6</b></div><h3>'+esc(c.dealCards[5].h)+'</h3><p class="s">'+esc(c.dealCards[5].s)+'</p><a class="go" href="/pack">'+esc(c.dealPrint)+'</a></article>';
  document.getElementById('dealHint').textContent = c.dealHint;
  document.getElementById('dealClose').textContent = c.dealClose;
  if (window.Deal) Deal.relayout();
  if (window.ScrollCraft && ScrollCraft.instances && ScrollCraft.instances[0]) ScrollCraft.instances[0].layout();
}
document.getElementById('langEN').classList.toggle('on', lang==='en');
document.getElementById('langES').classList.toggle('on', lang==='es');
render();
</script>


<script src="/scroll-intro/scrollcraft.js?v=2026-09-02b"></script>
<script>
/* ===================================================================
   The Deal. Six real cards in the chrome layer, fanned by PAGE scroll across
   the peak act (so the choreography outlives the cuts underneath, which is
   how a cutlist holds a peak without pinning), openable from the bar anywhere
   on the page, and flickable: pointer capture, velocity carried into the
   throw, spring back if the flick was not committed. Engine untouched; this
   reads scroll and its own state only.
   =================================================================== */
(function(){
  var deal = document.getElementById('deal'), hand = document.getElementById('hand'),
      trig = document.getElementById('dealTrigger'), closeBtn = document.getElementById('dealClose'),
      bg = deal.querySelector('.deal-bg'),
      act = null, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var p = 0, target = 0, mode = 'scroll', dealt = [], raf = null, cards = [];
  var FAN = [-26,-15.5,-5,5,15.5,26];               // degrees, left to right
  var ease = function(x){ return 1 - Math.pow(1 - x, 3); };

  function relayout(){
    cards = Array.prototype.slice.call(hand.querySelectorAll('.card'));
    dealt = []; act = document.getElementById('deal-act');
    cards.forEach(function(el){ el.style.transition = ''; });
    if (mode === 'scroll') p = progressFromScroll();
    paint();
  }
  function progressFromScroll(){
    if (!act) return 0;
    var r = act.getBoundingClientRect(), vh = innerHeight;
    // 0 as the act's top reaches the fold, 1 once ~55% of it has passed, and
    // back to 0 as it leaves, so the deck folds away before the next cut
    var enter = Math.max(0, Math.min(1, (vh - r.top) / (r.height * 0.55 + vh * 0.2)));
    var leave = Math.max(0, Math.min(1, (r.bottom - vh * 0.35) / (vh * 0.5)));
    return Math.min(enter, leave);
  }
  function paint(){
    var live = p > 0.02;
    deal.classList.toggle('is-live', live);
    var fanned = 0;
    for (var i = 0; i < cards.length; i++){
      var el = cards[i];
      if (dealt.indexOf(i) > -1) continue;
      var pi = Math.max(0, Math.min(1, (p - i * 0.07) / 0.6));
      var e = ease(pi); if (e > 0.98) fanned++;
      // --fan-scale lets the stylesheet tighten the spread on narrow screens,
      // where a 26-degree fan of 64vw cards runs off both edges
      var fs = parseFloat(getComputedStyle(hand).getPropertyValue('--fan-scale')) || 1;
      var rot = FAN[i] * e * fs, rise = -6 * e, sc = 0.62 + 0.38 * e;
      el.style.transform = 'translate3d(0,' + rise + 'vh,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
      el.style.opacity = String(Math.min(1, 0.15 + e));
      el.style.zIndex = String(10 + i);
    }
    // the harness reads this instead of guessing what a fixed layer painted
    deal.setAttribute('data-sc-verify-state', 'p:' + p.toFixed(2) + '|fanned:' + fanned + '|dealt:' + dealt.length);
    if (p >= 0.995) deal.setAttribute('data-sc-verify-hold', 'true'); else deal.removeAttribute('data-sc-verify-hold');
  }
  function tick(){
    raf = null;
    if (mode === 'scroll') { p = progressFromScroll(); paint(); return; }
    var d = target - p;
    if (Math.abs(d) < 0.003) {
      p = target; paint();
      if (target === 0) { mode = 'scroll'; deal.classList.remove('is-open'); trig.setAttribute('aria-expanded','false'); p = progressFromScroll(); paint(); }
      return;
    }
    p += d * (reduce ? 1 : 0.14); paint(); raf = requestAnimationFrame(tick);
  }
  function schedule(){ if (!raf) raf = requestAnimationFrame(tick); }
  function open(){ mode = 'open'; target = 1; deal.classList.add('is-open'); trig.setAttribute('aria-expanded','true'); relayout(); schedule(); closeBtn.focus(); }
  function close(){ if (mode !== 'open') return; target = 0; schedule(); trig.focus(); }
  addEventListener('scroll', function(){ if (mode === 'scroll') schedule(); }, {passive:true});
  addEventListener('resize', function(){ schedule(); }, {passive:true});
  trig.addEventListener('click', function(){ mode === 'open' ? close() : open(); });
  closeBtn.addEventListener('click', close);
  bg.addEventListener('click', close);
  addEventListener('keydown', function(e){ if (e.key === 'Escape' && mode === 'open') close(); });

  /* flick: 1:1 tracking from where the card was grabbed, velocity history,
     project the release, commit past a threshold, else spring home */
  var drag = null;
  hand.addEventListener('pointerdown', function(e){
    var el = e.target.closest('.card'); if (!el || e.target.closest('a')) return;
    var i = cards.indexOf(el); if (i < 0 || dealt.indexOf(i) > -1) return;
    // best-effort: capture keeps tracking when the pointer leaves the card, but
    // a capture that cannot be taken must not abort the drag (it threw on
    // pointer ids the element had never seen, and the whole flick died with it)
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { i:i, el:el, x0:e.clientX, y0:e.clientY, dx:0, dy:0, hist:[[e.clientX,e.clientY,performance.now()]] };
    el.style.transition = 'none';
    e.preventDefault();
  });
  addEventListener('pointermove', function(e){
    if (!drag) return;
    drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
    drag.hist.push([e.clientX,e.clientY,performance.now()]); if (drag.hist.length > 6) drag.hist.shift();
    var rot = FAN[drag.i] + drag.dx * 0.06;
    drag.el.style.transform = 'translate3d(' + drag.dx + 'px,' + (drag.dy - innerHeight*0.06) + 'px,0) rotate(' + rot.toFixed(2) + 'deg)';
  });
  function release(){
    if (!drag) return;
    var h = drag.hist, a = h[0], b = h[h.length-1], dt = Math.max(1, b[2]-a[2]);
    var vx = (b[0]-a[0])/dt, vy = (b[1]-a[1])/dt, v = Math.hypot(vx,vy);
    var dist = Math.hypot(drag.dx, drag.dy), el = drag.el, i = drag.i;
    if (v > 0.45 || dist > 140){
      var fx = drag.dx + vx * 600, fy = drag.dy + vy * 600 - innerHeight*0.06;
      el.style.transition = reduce ? 'opacity 120ms' : 'transform 480ms cubic-bezier(.23,1,.32,1), opacity 420ms';
      el.style.transform = 'translate3d(' + fx + 'px,' + fy + 'px,0) rotate(' + (FAN[i] + vx*40) + 'deg)';
      el.style.opacity = '0'; dealt.push(i);
      setTimeout(function(){ el.style.transition = ''; paint(); }, 500);
    } else {
      el.style.transition = reduce ? 'none' : 'transform 420ms cubic-bezier(.23,1,.32,1)';
      paint(); setTimeout(function(){ el.style.transition = ''; }, 440);
    }
    drag = null;
  }
  // release on the window, not the hand: if capture was refused the pointer
  // can let go anywhere on the page, and a drag that never releases would
  // leave the card stuck to a pointer that is no longer down
  addEventListener('pointerup', release); addEventListener('pointercancel', release);

  window.Deal = { relayout: relayout, open: open, close: close };
  relayout();

  /* mount the engine on the whole page: every cut is a flow act and publishes
     --sc-p, which is what the reveals and cues run from */
  if (window.ScrollCraft) ScrollCraft.mount(document.body);
})();
</script>
