name: Diagnose Facebook token

# Read-only. Prints what Facebook reports ABOUT the stored token — type, app,
# issue and expiry times, scopes — and never the token itself. Publishes
# nothing and changes nothing.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect the stored token
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node tools/fb-diagnose.mjs
