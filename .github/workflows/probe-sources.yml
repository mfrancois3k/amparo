name: Probe statute sources

# TEMPORARY. Finds which statute hosts answer a GitHub Actions runner, since
# FindLaw serves a residential IP but 403s a datacenter one. Manual trigger
# only — delete this file once law-watch.json points at hosts that work.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/probe-sources.mjs
