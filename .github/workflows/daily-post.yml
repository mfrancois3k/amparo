name: Daily Facebook post

# Runs on GitHub's infrastructure, not a laptop — same reasoning as the daily
# statute source check. The point of this routine is that it keeps producing
# without anyone being at a machine.
#
# SAFE BEFORE THE PAGE EXISTS. Without FB_PAGE_ID / FB_PAGE_TOKEN the script
# writes the day's draft to content/facebook/ and publishes nothing. So this
# can be merged and left running today; the day those two secrets are added,
# it starts posting with a backlog of drafts already proving what it produces.
on:
  schedule:
    - cron: '32 15 * * *'      # 15:32 UTC ≈ late morning US — off-the-hour to dodge the rush
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify = check credentials, publish nothing. publish = post for real.'
        required: true
        default: verify
        type: choice
        options: [verify, publish]
      date:
        description: 'Override the post date (YYYY-MM-DD)'
        required: false

permissions:
  contents: write              # commit the day's draft so there is a record of what was posted

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guards the content pool itself, not just the publish call. If a rule
      # edit in index.html ever breaks extraction, or a card-only line starts
      # leaking into social, this fails BEFORE anything reaches the page —
      # which is the only moment a bad post is still cheap to stop.
      - name: Self-check the generator
        run: |
          node tools/news-post.mjs --selftest
          node tools/daily-post.mjs --selftest

      # Manual "verify" run: proves the stored secrets actually work — right
      # page, can post, token does not expire — by writing an UNPUBLISHED
      # draft. Nothing becomes visible and nothing needs deleting afterwards.
      # This exists so the first thing that ever happens with a new token is
      # not a surprise public post.
      - name: Verify credentials only (publishes nothing)
        if: inputs.mode == 'verify'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node tools/fb-token-check.mjs --post-test

      # The scheduled path has no inputs, so inputs.mode is empty and this
      # runs — a cron firing must always publish.
      - name: Generate and publish
        if: inputs.mode != 'verify'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node tools/news-post.mjs --publish ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit the day's post record
        if: inputs.mode != 'verify'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/facebook
          git diff --staged --quiet || git commit -m "chore: daily post record ($(date -u +%F))"
          git push
